<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gpx-to-geojson demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin: 0; font-family: sans-serif; }
  header { padding: 8px 12px; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  p { margin: 2px 0; font-size: .9rem; }
  #map { height: calc(100vh - 100px); }
</style>
</head>
<body>
<header>
  <h1>gpx-to-geojson: Cairo landmarks</h1>
  <p>Four Cairo landmarks (waypoints) and the route joining them, converted from GPX to GeoJSON; click the route for its geodesic length.</p>
  <p><a href="https://github.com/AmmarYasser455/gpx-to-geojson">Source on GitHub</a></p>
</header>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  fetch('demo.geojson').then(function (r) { return r.json(); }).then(function (data) {
    var layer = L.geoJSON(data, {
      onEachFeature: function (f, l) {
        var p = f.properties;
        l.bindPopup(p.kind === 'route'
          ? p.name + ': ' + (p.distance_m / 1000).toFixed(2) + ' km'
          : p.name);
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds());
  });
</script>
</body>
</html>
