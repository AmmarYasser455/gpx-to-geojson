[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx-to-geojson"
version = "0.1.0"
description = "Convert GPX tracks, routes and waypoints to GeoJSON with timestamps, elevation and per-track distance and duration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyproj>=3.4", "shapely>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gpx-to-geojson = "gpx_to_geojson.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
